server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Repeated in any location below that sets its own add_header, because nginx
    # drops inherited headers in a block that declares one of its own.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 1m;

    # The base image ships with gzip off. Fonts and images are already compressed.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;

    # Docker's embedded DNS, resolved per request so that recreating the api container
    # does not leave nginx holding its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The backend serves its routes at the root, so strip the /api prefix. Keeping the
    # API on the same origin means the bundle never needs to know its own domain.
    location /api/ {
        set $endurance_api "api:8080";
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://$endurance_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # expires rather than add_header, so the security headers above still apply here.
    location = /index.html {
        expires -1;
    }

    # Unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
